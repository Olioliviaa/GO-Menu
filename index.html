  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
    html { scroll-behavior: smooth; }
    body{background:#f7f8fa;padding-bottom:60px;}
    
    /* 顶部标题 */
    header{background:#2c3e50;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:600;position:sticky;top:0;z-index:100;}
    
    /* 主容器：左侧导航 + 右侧菜单 */
    .layout-wrapper {
      display: flex;
      max-width: 900px;
      margin: 0 auto;
      align-items: flex-start;
    }

    /* 左侧分类导航 */
    .category-nav {
      width: 90px;
      flex-shrink: 0;
      background: #fff;
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
      overflow-y: auto;
      border-right: 1px solid #eee;
      display: flex;
      flex-direction: column;
      padding: 10px 4px;
      box-shadow: 2px 0 4px rgba(0,0,0,0.03);
    }

    .category-nav a {
      color: #555;
      text-decoration: none;
      padding: 10px 4px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #f0f2f5;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: block;
    }
    
    .category-nav a:hover, .category-nav a:active {
      background: #27ae60;
      color: #fff;
    }

    /* 右侧容器与模块 */
    .container{flex:1;padding:12px;min-width:0;}
    .info-block{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 4px #00000012;}
    input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:16px;margin-top:8px;}
    textarea{min-height:70px;resize:none;}

    /* 分类标题 */
    .category-title {
      font-size: 16px;
      font-weight: 600;
      margin: 16px 0 10px 0;
      padding-left: 8px;
      border-left: 4px solid #27ae60;
      color: #2c3e50;
      scroll-margin-top: 70px;
    }

    /* 菜品列表：固定一行显示两个 */
    .dish-list{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .dish-item{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #00000012;}
    .dish-img{height:100px;background:#e8e8e8;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;object-fit:cover;width:100%;}
    .dish-body{padding:8px;}
    .dish-name{font-size:14px;font-weight:500;margin-bottom:6px;word-break:break-all;}
    .checkbox-wrap{display:flex;align-items:center;gap:6px;}
    
    .submit-btn{width:100%;background:#27ae60;color:#fff;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:600;margin-top:20px;cursor:pointer;}
    .tip{font-size:13px;color:#888;margin-top:6px;}
    .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:14px 22px;border-radius:8px;display:none;z-index:9999;}

    @media (max-width: 360px) {
      .category-nav { width: 75px; }
      .category-nav a { font-size: 11px; padding: 8px 2px; }
      .container { padding: 8px; }
      .dish-list { gap: 6px; }
    }
  </style>

<script>
const form = document.getElementById('mainForm');
const iframe = document.getElementById('hidden_iframe');
const toast = document.getElementById('toast');

form.addEventListener('submit', function(e){
  const checks = document.querySelectorAll('.dish-check:checked');
  const selected = Array.from(checks).map(cb=>cb.dataset.name).join('、');

  document.getElementById('field_name').value = document.getElementById('username').value;
  document.getElementById('field_note').value = document.getElementById('remark').value;
  document.getElementById('field_dishes').value = selected;
});

iframe.onload = function(){
  toast.style.display='block';
  setTimeout(()=>{
    toast.style.display='none';
    form.reset();
  },1800);
}
</script>
