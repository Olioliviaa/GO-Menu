<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO-Menu 点餐平台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', -apple-system, sans-serif; background-color: #f7f7f7; color: #333; display: flex; flex-direction: column; height: 100vh; }
        .header { background: linear-gradient(135deg, #ff9900, #ff5500); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; line-height: 1.4; }
        .main-container { flex: 1; display: flex; overflow: hidden; background: white; }
        .sidebar { width: 85px; background-color: #f8f8f8; overflow-y: auto; height: 100%; border-right: 1px solid #eee; }
        .category-btn { width: 100%; padding: 18px 10px; border: none; background: none; font-size: 14px; color: #666; cursor: pointer; text-align: center; border-left: 4px solid transparent; }
        .category-btn.active { background: white; color: #ff5500; font-weight: bold; border-left-color: #ff5500; }
        .menu-content { flex: 1; overflow-y: auto; height: 100%; padding: 10px; }
        .category-section { display: none; }
        .category-section.active { display: block; }
        .section-title { font-size: 14px; color: #888; margin: 5px 0 12px 5px; }
        .dish-card { display: flex; background: white; padding: 10px 5px; margin-bottom: 15px; border-bottom: 1px solid #f2f2f2; align-items: center; }
        .dish-img { width: 75px; height: 75px; border-radius: 6px; object-fit: cover; margin-right: 12px; background-color: #eee; cursor: pointer; }
        .dish-info { flex: 1; margin-right: 10px; }
        .dish-name { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
        .dish-desc { font-size: 12px; color: #999; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .dish-price { color: #ff4400; font-size: 16px; font-weight: bold; }
        .control-box { display: flex; align-items: center; gap: 8px; }
        .btn-calc { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #ff5500; background: white; color: #ff5500; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-calc.add { background: #ff5500; color: white; }
        .dish-count { font-size: 14px; min-width: 14px; text-align: center; }
        .cart-bar { height: 55px; background: #333; display: flex; justify-content: space-between; align-items: center; padding-left: 20px; color: white; z-index: 10; }
        .cart-info { font-size: 14px; }
        .cart-total-price { font-size: 20px; font-weight: bold; color: #ff9900; margin-left: 5px; }
        .btn-submit { background: #ff5500; border: none; color: white; height: 100%; padding: 0 30px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: white; border-radius: 12px; width: 100%; max-width: 320px; overflow: hidden; position: relative; text-align: center; padding-bottom: 20px; }
        .modal-img { width: 100%; height: 200px; object-fit: cover; background-color: #eee; }
        .modal-name { font-size: 18px; font-weight: bold; margin: 15px 0 8px; }
        .modal-full-desc { font-size: 14px; color: #666; padding: 0 20px; margin-bottom: 15px; line-height: 1.4; }
        .btn-close-modal { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 14px; cursor: pointer; z-index: 110; }
        .summary-content { background: white; border-radius: 12px; width: 95%; max-width: 360px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .summary-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #ff5500; padding-bottom: 8px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .summary-total { text-align: right; font-size: 18px; font-weight: bold; color: #ff5500; border-top: 1px dashed #eee; padding-top: 12px; margin-top: 15px; }
        .btn-confirm-order { width: 100%; background: #ff5500; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>GO-Menu</h1>
        <p>欢迎来到 GO-Menu 点餐平台！点击左侧分类浏览，点击图片查看详细介绍。</p>
    </div>
    <div class="main-container">
        <div class="sidebar">
            <button class="category-btn active" onclick="switchCategory('zhushi', this)">主食</button>
            <button class="category-btn" onclick="switchCategory('roulei', this)">肉类</button>
            <button class="category-btn" onclick="switchCategory('haixian', this)">海鲜</button>
            <button class="category-btn" onclick="switchCategory('shuce', this)">蔬菜</button>
            <button class="category-btn" onclick="switchCategory('tiandian', this)">甜品</button>
            <button class="category-btn" onclick="switchCategory('yinpin', this)">饮品</button>
        </div>
        <div class="menu-content">
            <div id="zhushi" class="category-section active">
                <div class="section-title">美味主食 / Staples</div>
                <div class="dish-card" data-id="1" data-name="精选招牌炒饭" data-price="8.50" data-desc="粒粒金黄的优质大米，搭配鲜嫩虾仁与时令蔬菜。">
                    <img src="https://unsplash.com" class="dish-img" onclick="showDetail(this)">
                    <div class="dish-info">
                        <div class="dish-name">精选招牌炒饭</div>
                        <div class="dish-desc">大米粒粒金黄，搭配鲜嫩虾仁。</div>
                        <div class="dish-price">$8.50</div>
                    </div>
                    <div class="control-box">
                        <button class="btn-calc minus" onclick="updateQty(this, -1)" style="display:none;">-</button>
                        <span class="dish-count" style="display:none;">0</span>
                        <button class="btn-calc add" onclick="updateQty(this, 1)">+</button>
                    </div>
                </div>
            </div>
            <div id="roulei" class="category-section">
                <div class="section-title">经典肉类 / Meat</div>
                <div class="dish-card" data-id="2" data-name="美式香烤排骨" data-price="18.99" data-desc="精选上等猪肋排，刷上秘制果木BBQ烤肉酱。">
                    <img src="https://unsplash.com" class="dish-img" onclick="showDetail(this)">
                    <div class="dish-info">
                        <div class="dish-name">美式香烤排骨</div>
                        <div class="dish-desc">肉质酥烂、骨肉分离，BBQ风味浓郁。</div>
                        <div class="dish-price">$18.99</div>
                    </div>
                    <div class="control-box">
                        <button class="btn-calc minus" onclick="updateQty(this, -1)" style="display:none;">-</button>
                        <span class="dish-count" style="display:none;">0</span>
                        <button class="btn-calc add" onclick="updateQty(this, 1)">+</button>
                    </div>
                </div>
            </div>
            <div id="haixian" class="category-section">
                <div class="section-title">新鲜海鲜 / Seafood</div>
                <div class="dish-card" data-id="3" data-name="香煎黄油大虾" data-price="15.50" data-desc="深海直达大虾，用高级黄油与浓郁蒜蓉双面煎至金黄。">
                    <img src="https://unsplash.com" class="dish-img" onclick="showDetail(this)">
                    <div class="dish-info">
                        <div class="dish-name">香煎黄油大虾</div>
                        <div class="dish-desc">黄油与浓郁蒜蓉双面煎至金黄。</div>
                        <div class="dish-price">$15.50</div>
                    </div>
                    <div class="control-box">
                        <button class="btn-calc minus" onclick="updateQty(this, -1)" style="display:none;">-</button>
                        <span class="dish-count" style="display:none;">0</span>
                        <button class="btn-calc add" onclick="updateQty(this, 1)">+</button>
                    </div>
                </div>
            </div>
            <div id="shuce" class="category-section">
                <div class="section-title">时令蔬菜 / Vegetables</div>
                <div class="dish-card" data-id="4" data-name="田园凯撒沙拉" data-price="7.99" data-desc="爽脆的罗马生菜，拌入酥脆面包丁与干酪。">
                    <img src="https://unsplash.com" class="dish-img" onclick="showDetail(this)">
                    <div class="dish-info">
                        <div class="dish-name">田园凯撒沙拉</div>
                        <div class="dish-desc">有机爽脆生菜，搭配低脂凯撒酱。</div>
                        <div class="dish-price">$7.99</div>
                    </div>
                    <div class="control-box">
                        <button class="btn-calc minus" onclick="updateQty(this, -1)" style="display:none;">-</button>
                        <span class="dish-count" style="display:none;">0</span>
                        <button class="btn-calc add" onclick="updateQty(this, 1)">+</button>
                    </div>
                </div>
            </div>
            <div id="tiandian" class="category-section">
                <div class="section-title">精美甜品 / Desserts</div>
